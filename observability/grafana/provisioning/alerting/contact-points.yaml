apiVersion: 1

contactPoints:
  - orgId: 1
    name: email-oncall
    receivers:
      - uid: email-oncall
        type: email
        disableResolveMessage: false
        settings:
          # ALERT_EMAIL_TO is injected from docker-compose (semicolon separated list is allowed)
          addresses: ${ALERT_EMAIL_TO}
          singleEmail: true
          subject: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
