[server]
root_url = %(protocol)s://%(domain)s:%(http_port)s/

[analytics]
reporting_enabled = false
check_for_updates = false

[users]
default_theme = dark

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/eventflow-overview.json

[unified_alerting]
enabled = true
# evaluate rules every minute
min_interval = 10s

[alerting]
enabled = false

# SMTP is configured through GF_SMTP_* environment variables in docker-compose
# (defaults to the bundled MailHog, UI on http://localhost:8025).
