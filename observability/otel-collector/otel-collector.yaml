# OpenTelemetry Collector (contrib) - the single ingestion point for ALL telemetry.
#
#   apps (OTLP)  --traces-->  Tempo        (otlp/grpc)
#   apps (OTLP)  --metrics--> Mimir        (prometheus remote write)
#   apps (OTLP)  --logs---->  Loki         (OTLP http, /otlp)
#   exporters    --metrics--> Mimir        (prometheus receiver = scraper)
#
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # ---- Scrape every infra exporter and push the result to Mimir ----
  prometheus:
    config:
      global:
        scrape_interval: 15s
        scrape_timeout: 10s
      scrape_configs:
        - job_name: cadvisor            # per-container CPU / memory / network
          static_configs:
            - targets: ["cadvisor:8080"]
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: container_(cpu_usage_seconds_total|cpu_cfs_throttled_periods_total|cpu_cfs_periods_total|memory_working_set_bytes|memory_usage_bytes|memory_rss|spec_memory_limit_bytes|spec_cpu_quota|spec_cpu_period|network_receive_bytes_total|network_transmit_bytes_total|last_seen|start_time_seconds)
              action: keep
            - source_labels: [name]       # drop cgroups that are not docker containers
              regex: ".+"
              action: keep

        - job_name: node-exporter       # host / node level CPU, memory, disk, load
          static_configs:
            - targets: ["node-exporter:9100"]

        - job_name: postgres
          static_configs:
            - targets: ["postgres-exporter:9187"]
              labels:
                role: primary

        - job_name: postgres-replica
          static_configs:
            - targets: ["postgres-replica-exporter:9187"]
              labels:
                role: replica

        - job_name: pgbouncer
          static_configs:
            - targets: ["pgbouncer-exporter:9127"]

        - job_name: redis
          static_configs:
            - targets: ["redis-exporter:9121"]

        - job_name: kafka-exporter      # consumer lag, partitions, offsets
          static_configs:
            - targets: ["kafka-exporter:9308"]

        - job_name: kafka-jmx           # broker internals: request latency, ISR, throughput
          static_configs:
            - targets: ["kafka:7071"]

        # ---- Uptime / availability: black-box HTTP probes of each service ----
        - job_name: blackbox-http
          metrics_path: /probe
          params:
            module: [http_2xx]
          static_configs:
            - targets: ["http://api-gateway:3000/health"]
              labels: {service: api-gateway}
            - targets: ["http://auth-service:3001/health"]
              labels: {service: auth-service}
            - targets: ["http://events-service:3003/health"]
              labels: {service: events-service}
            - targets: ["http://tickets-service:3004/health"]
              labels: {service: tickets-service}
            - targets: ["http://notifications-service:3006/health"]
              labels: {service: notifications-service}
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: instance
            - target_label: __address__
              replacement: blackbox-exporter:9115

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch:
    timeout: 5s
    send_batch_size: 2048

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  prometheusremotewrite:
    endpoint: http://mimir:9009/api/v1/push
    tls:
      insecure: true
    # Resource attributes are NOT copied to labels (would explode label count);
    # service.name becomes the `job` label and service.instance.id the `instance` label.
    resource_to_telemetry_conversion:
      enabled: false
    add_metric_suffixes: true
    send_metadata: true

  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
