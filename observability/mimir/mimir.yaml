# Grafana Mimir - monolithic mode, blocks persisted in S3 (MinIO locally, AWS S3 in prod).
# Started with: -config.file=/etc/mimir/mimir.yaml -config.expand-env=true
target: all
multitenancy_enabled: false

server:
  http_listen_port: 9009
  grpc_listen_port: 9095
  log_level: warn

common:
  storage:
    backend: s3
    s3:
      endpoint: ${S3_ENDPOINT}              # minio:9000 locally
      region: ${S3_REGION}
      access_key_id: ${S3_ACCESS_KEY}
      secret_access_key: ${S3_SECRET_KEY}
      insecure: ${S3_INSECURE}              # true for plain-http MinIO, false for AWS

blocks_storage:
  s3:
    bucket_name: ${MIMIR_BLOCKS_BUCKET}
  tsdb:
    dir: /data/ingester                     # WAL + head block (local, short lived)
  bucket_store:
    sync_dir: /data/tsdb-sync

ruler_storage:
  s3:
    bucket_name: ${MIMIR_RULER_BUCKET}

compactor:
  data_dir: /data/compactor
  sharding_ring:
    kvstore:
      store: memberlist

distributor:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist

ingester:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist
    replication_factor: 1

store_gateway:
  sharding_ring:
    replication_factor: 1

ruler:
  rule_path: /data/ruler

memberlist:
  join_members: []

limits:
  compactor_blocks_retention_period: 30d    # blocks older than this are deleted from the bucket
  ingestion_rate: 50000
  ingestion_burst_size: 500000
  max_global_series_per_user: 1500000
  max_label_names_per_series: 60
  max_global_exemplars_per_user: 100000     # enables metric -> trace exemplars
  out_of_order_time_window: 5m

usage_stats:
  enabled: false
