# Grafana Loki - single binary, chunks + TSDB index persisted in S3.
# Started with: -config.file=/etc/loki/loki.yaml -config.expand-env=true
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    s3:
      endpoint: ${S3_ENDPOINT}
      region: ${S3_REGION}
      access_key_id: ${S3_ACCESS_KEY}
      secret_access_key: ${S3_SECRET_KEY}
      bucketnames: ${LOKI_CHUNKS_BUCKET}
      s3forcepathstyle: true
      insecure: ${S3_INSECURE}

schema_config:
  configs:
    - from: "2024-04-01"
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache

ruler:
  storage:
    type: s3
    s3:
      endpoint: ${S3_ENDPOINT}
      region: ${S3_REGION}
      access_key_id: ${S3_ACCESS_KEY}
      secret_access_key: ${S3_SECRET_KEY}
      bucketnames: ${LOKI_RULER_BUCKET}
      s3forcepathstyle: true
      insecure: ${S3_INSECURE}

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: s3

limits_config:
  retention_period: 336h          # 14 days
  allow_structured_metadata: true # required for OTLP ingestion (trace_id, span_id, ...)
  volume_enabled: true
  discover_log_levels: true
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  reject_old_samples: true
  reject_old_samples_max_age: 168h

pattern_ingester:
  enabled: true

analytics:
  reporting_enabled: false
