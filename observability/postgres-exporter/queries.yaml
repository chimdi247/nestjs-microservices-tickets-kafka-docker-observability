# Custom queries for postgres_exporter (--extend.query-path).
# Metric name = <query key>_<column>.

pgx_connections:
  query: |
    SELECT
      (SELECT count(*) FROM pg_stat_activity WHERE backend_type = 'client backend')::float8                    AS used,
      (SELECT count(*) FROM pg_stat_activity WHERE backend_type = 'client backend' AND state = 'active')::float8 AS active,
      (SELECT setting::float8 FROM pg_settings WHERE name = 'max_connections')                                   AS max
  metrics:
    - used:
        usage: GAUGE
        description: Client backends currently connected
    - active:
        usage: GAUGE
        description: Client backends currently executing a query
    - max:
        usage: GAUGE
        description: max_connections setting

pgx_replication:
  query: |
    SELECT
      CASE WHEN pg_is_in_recovery() THEN 1 ELSE 0 END::float8 AS is_replica,
      CASE
        WHEN NOT pg_is_in_recovery() THEN 0
        WHEN pg_last_wal_receive_lsn() = pg_last_wal_replay_lsn() THEN 0
        ELSE GREATEST(0, EXTRACT(EPOCH FROM (now() - pg_last_xact_replay_timestamp())))
      END::float8 AS lag_seconds,
      (SELECT count(*) FROM pg_stat_replication)::float8 AS connected_replicas,
      (SELECT COALESCE(MAX(pg_wal_lsn_diff(pg_current_wal_lsn(), replay_lsn)), 0) FROM pg_stat_replication)::float8 AS lag_bytes
  metrics:
    - is_replica:
        usage: GAUGE
        description: 1 when this server is a standby
    - lag_seconds:
        usage: GAUGE
        description: Replay lag in seconds (standby only, 0 when caught up)
    - connected_replicas:
        usage: GAUGE
        description: Number of standbys streaming from this server
    - lag_bytes:
        usage: GAUGE
        description: Worst WAL replay lag in bytes across connected standbys (primary only)
