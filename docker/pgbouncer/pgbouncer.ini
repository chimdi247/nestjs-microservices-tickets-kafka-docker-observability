[databases]
; clients connect to "eventflowapp" on pgbouncer, which forwards to the primary
eventflowapp = host=postgres port=5432 dbname=eventflowapp

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; "eventflowapp" may use the admin console (SHOW POOLS/STATS...) - used by pgbouncer-exporter
admin_users = eventflowapp
stats_users = eventflowapp

; transaction pooling: a server connection is held only for the duration of a transaction
pool_mode = transaction
max_client_conn = 500
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 40

server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits,options
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 15
